{% extends 'base.html' %}
{% load static %}
{% block title %}
Регистрация
{% endblock %}
{% block content %}
<div class="card mb-3 no-border-card">
    <div class="card-body">
        <h5 class="card-title">Регистрация</h5>
        {% load django_bootstrap5 %}
        <form action="{% url 'register' %}" method="POST" class="form">
        {% csrf_token %}

        {% bootstrap_form form %}

        {% bootstrap_button button_type="submit" content="Войти" %}
        </form>
    </div>
</div>
{% endblock %}
