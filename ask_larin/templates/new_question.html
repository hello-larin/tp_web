{% extends 'base.html' %}
{% block content %}
<div class="card mb-3 no-border-card">
    <div class="card-body">
        <h5 class="card-title">Новый запрос</h5>
        {% load django_bootstrap5 %}
        <form action="{% url 'new_question' %}?next={{ next_url }}" method="POST" class="form">
        {% csrf_token %}

        {% bootstrap_form form %}

        {% bootstrap_button button_type="submit" content="Задать" %}
        </form>
    </div>
</div>
{% endblock %}
